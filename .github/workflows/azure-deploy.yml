name: Build and Deploy to Azure Container Apps

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  AZURE_CONTAINER_REGISTRY: hermesregistryps.azurecr.io
  CONTAINER_APP_NAME: hermes-bot
  RESOURCE_GROUP: hermes-rg
  CONTAINER_APP_ENV: hermes-env

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.AZURE_CONTAINER_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.AZURE_CONTAINER_REGISTRY }}/hermes-bot:${{ github.sha }}
          # Disabled layer caching to ensure Telegram extra is installed
          # cache-from: type=gha
          # cache-to: type=gha,mode=max
          # Enable full rebuild
          no-cache: true

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Delete existing Container App (to clear stuck revisions)
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az containerapp delete --name ${{ env.CONTAINER_APP_NAME }} --resource-group ${{ env.RESOURCE_GROUP }} --yes --output none || echo "Container app may not exist yet"
            sleep 10

      - name: Update Container App
        uses: azure/container-apps-deploy-action@v2
        with:
          containerAppName: ${{ env.CONTAINER_APP_NAME }}
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          imageToDeploy: ${{ env.AZURE_CONTAINER_REGISTRY }}/hermes-bot:${{ github.sha }}
          ingress: external
          targetPort: 8000
          environmentVariables: |
            TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
            TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}
            TELEGRAM_ADMIN_CHAT_IDS=${{ secrets.TELEGRAM_ADMIN_CHAT_IDS }}
            NVIDIA_API_KEY=${{ secrets.NVIDIA_API_KEY }}
            GATEWAY_ALLOW_ALL_USERS=true