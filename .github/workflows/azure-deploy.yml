name: Build and Deploy to Azure Container Apps

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  AZURE_CONTAINER_REGISTRY: hermesregistryps.azurecr.io
  CONTAINER_APP_NAME: hermes-bot
  RESOURCE_GROUP: hermes-rg
  CONTAINER_APP_ENV: hermes-env
  IMAGE_NAME: hermes-bot

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.AZURE_CONTAINER_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.AZURE_CONTAINER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          no-cache: true

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Delete old Container App
        uses: azure/CLI@v2
        with:
          inlineScript: |
            set -e
            APP_NAME="${{ env.CONTAINER_APP_NAME }}"
            RG="${{ env.RESOURCE_GROUP }}"
            echo "Deleting existing Container App..."
            az containerapp delete --name "${{ env.CONTAINER_APP_NAME }}" --resource-group "${{ env.RESOURCE_GROUP }}" --yes --output none 2>/dev/null || echo "App didn't exist"
            # Wait for deletion to complete
            for i in {1..30}; do
              if ! az containerapp show --name "${{ env.CONTAINER_APP_NAME }}" --resource-group "${{ env.RESOURCE_GROUP }}" --query "name" -o tsv 2>/dev/null; then
                echo "App deleted successfully"
                break
              fi
              echo "Waiting for deletion... ($i/30)"
              sleep 5
            done

      - name: Create new Container App
        uses: azure/CLI@v2
        with:
          inlineScript: |
            set -e
            
            IMAGE="${{ env.AZURE_CONTAINER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
            APP_NAME="${{ env.CONTAINER_APP_NAME }}"
            RG="${{ env.RESOURCE_GROUP }}"
            ENV="${{ env.CONTAINER_APP_ENV }}"
            ACR="${{ env.AZURE_CONTAINER_REGISTRY }}"
            
            echo "Creating new Container App..."
            az containerapp create \
              --name "$APP_NAME" \
              --resource-group "$RG" \
              --environment "$ENV" \
              --image "$IMAGE" \
              --target-port 8000 \
              --ingress external \
              --min-replicas 1 \
              --max-replicas 1 \
              --ingress AdditionalPortMappings port=8080 targetPort=8080 \
              --registry-server "$ACR" \
              --registry-username "${{ secrets.ACR_USERNAME }}" \
              --registry-password "${{ secrets.ACR_PASSWORD }}" \
              --env-vars \
                TELEGRAM_BOT_TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}" \
                TELEGRAM_CHAT_ID="${{ secrets.TELEGRAM_CHAT_ID }}" \
                TELEGRAM_ADMIN_CHAT_IDS="${{ secrets.TELEGRAM_ADMIN_CHAT_IDS }}" \
                NVIDIA_API_KEY="${{ secrets.NVIDIA_API_KEY }}" \
                GATEWAY_ALLOW_ALL_USERS=true \
              --output none
            
            echo "=== Deployment complete ==="
            az containerapp show --name "$APP_NAME" --resource-group "$RG" --query "{name:name, fqdn:properties.configuration.ingress.fqdn, state:properties.runningStatus}" -o json

      - name: Wait for container to be ready
        id: wait
        uses: azure/CLI@v2
        with:
          inlineScript: |
            set -e
            APP_NAME="${{ env.CONTAINER_APP_NAME }}"
            RG="${{ env.RESOURCE_GROUP }}"
            
            # Wait for container to be ready
            for i in {1..60}; do
              echo "Checking container status... ($i/60)"
              STATUS=$(az containerapp show --name "${{ env.CONTAINER_APP_NAME }}" --resource-group "${{ env.RESOURCE_GROUP }}" --query "properties.runningStatus" -o tsv 2>/dev/null || echo "Unknown")
              echo "Status: $STATUS"
              if [ "$STATUS" = "Running" ]; then
                echo "Container is running! Waiting for gateway health..."
                # Wait for health endpoint to respond
                for j in {1..30}; do
                  if curl -sf "https://${{ env.CONTAINER_APP_NAME }}.koreacentral.azurecontainerapps.io/health" > /dev/null 2>&1; then
                    echo "Health endpoint responding!"
                    break
                  fi
                  echo "Waiting for health... ($j/30)"
                  sleep 3
                done
                break
              fi
              echo "Waiting... ($i/60)"
              sleep 10
            done
            
            # Get final FQDN and export it
            FQDN=$(az containerapp show --name "${{ env.CONTAINER_APP_NAME }}" --resource-group "${{ env.RESOURCE_GROUP }}" --query "properties.configuration.ingress.fqdn" -o tsv)
            echo "FQDN: $FQDN"
            echo "fqdn=$FQDN" >> "$GITHUB_OUTPUT"

      - name: Set webhook
        uses: azure/CLI@v2
        with:
          inlineScript: |
            set -e
            FQDN="${{ steps.wait.outputs.fqdn }}"
            if [ -z "$FQDN" ]; then
              echo "ERROR: FQDN is empty - cannot set webhook"
              exit 1
            fi
            WEBHOOK_URL="https://$FQDN/webhooks/telegram"
            echo "Setting webhook to: $WEBHOOK_URL"
            curl -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/setWebhook" \
              -d "url=$WEBHOOK_URL" \
              -d "secret_token=hermes-webhook-secret-2026-08-06"
            echo "Webhook set to $WEBHOOK_URL"