name: Build and Deploy to Azure Container Apps

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  AZURE_CONTAINER_REGISTRY: hermesregistryps.azurecr.io
  CONTAINER_APP_NAME: hermes-bot
  RESOURCE_GROUP: hermes-rg
  CONTAINER_APP_ENV: hermes-env
  IMAGE_NAME: hermes-bot

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.AZURE_CONTAINER_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.AZURE_CONTAINER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          no-cache: true

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Container Apps
        uses: azure/CLI@v2
        with:
          inlineScript: |
            set -e
            
            IMAGE="${{ env.AZURE_CONTAINER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
            APP_NAME="${{ env.CONTAINER_APP_NAME }}"
            RG="${{ env.RESOURCE_GROUP }}"
            ENV="${{ env.CONTAINER_APP_ENV }}"
            ACR="${{ env.AZURE_CONTAINER_REGISTRY }}"
            
            # Check if app exists
            APP_EXISTS=$(az containerapp show --name "$APP_NAME" --resource-group "$RG" --query "name" -o tsv 2>/dev/null || echo "")
            
            if [ -z "$APP_EXISTS" ]; then
              echo "Creating new Container App..."
              az containerapp create \
                --name "$APP_NAME" \
                --resource-group "$RG" \
                --environment "$ENV" \
                --image "$IMAGE" \
                --target-port 8000 \
                --ingress external \
                --registry-server "$ACR" \
                --registry-username "${{ secrets.ACR_USERNAME }}" \
                --registry-password "${{ secrets.ACR_PASSWORD }}" \
                --env-vars \
                  TELEGRAM_BOT_TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}" \
                  TELEGRAM_CHAT_ID="${{ secrets.TELEGRAM_CHAT_ID }}" \
                  TELEGRAM_ADMIN_CHAT_IDS="${{ secrets.TELEGRAM_ADMIN_CHAT_IDS }}" \
                  NVIDIA_API_KEY="${{ secrets.NVIDIA_API_KEY }}" \
                  GATEWAY_ALLOW_ALL_USERS=true \
                --output none
            else
              echo "Updating existing Container App..."
              az containerapp update \
                --name "$APP_NAME" \
                --resource-group "$RG" \
                --image "$IMAGE" \
                --set-env-vars \
                  TELEGRAM_BOT_TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}" \
                  TELEGRAM_CHAT_ID="${{ secrets.TELEGRAM_CHAT_ID }}" \
                  TELEGRAM_ADMIN_CHAT_IDS="${{ secrets.TELEGRAM_ADMIN_CHAT_IDS }}" \
                  NVIDIA_API_KEY="${{ secrets.NVIDIA_API_KEY }}" \
                  GATEWAY_ALLOW_ALL_USERS=true \
                --output none
            fi
            
            echo "=== Deployment complete ==="
            az containerapp show --name "$APP_NAME" --resource-group "$RG" --query "{name:name, fqdn:properties.configuration.ingress.fqdn, state:properties.runningStatus}" -o json
