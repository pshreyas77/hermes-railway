# Railway deployment config for Hermes
# Bot token and sensitive values come from Railway environment variables

model:
  base_url: https://integrate.api.nvidia.com/v1
  default: minimaxai/minimax-m3
  provider: nvidia
fallback_providers: []
toolsets:
  - hermes-cli
agent:
  max_turns: 60
  gateway_timeout: 1800
  restart_drain_timeout: 180
  api_max_retries: 3
  service_tier: normal
  tool_use_enforcement: auto
  verify_on_stop: false
  gateway_timeout_warning: 900
  clarify_timeout: 600
  gateway_notify_interval: 180
  gateway_auto_continue_freshness: 3600
  image_input_mode: auto
  disabled_toolsets: []
  reasoning_effort: xhigh
  verbose: false
terminal:
  backend: local
  modal_mode: auto
  cwd: .
  timeout: 180
  env_passthrough: []
  shell_init_files: []
  auto_source_bashrc: true
  docker_image: nikolaik/python-nodejs:python3.11-nodejs20
  docker_forward_env: []
  singularity_image: docker://nikolaik/python-nodejs:python3.11-nodejs20
  modal_image: nikolaik/python-nodejs:python3.11-nodejs20
  daytona_image: docker://nikolaik/python-nodejs:python3.11-nodejs20
  vercel_runtime: node24
  container_cpu: 1
  container_memory: 5120
  container_disk: 51200
  container_persistent: true
  docker_volumes: []
  docker_mount_cwd_to_workspace: false
  docker_extra_args: []
  docker_run_as_host_user: false
  persistent_shell: true
  lifetime_seconds: 300
web:
  backend: ''
  search_backend: ''
  extract_backend: ''
browser:
  inactivity_timeout: 120
  command_timeout: 30
  record_sessions: false
  allow_private_urls: false
  engine: auto
  auto_local_for_private_urls: true
  cdp_url: ''
  dialog_policy: must_respond
  dialog_timeout_s: 300
  camofox:
    managed_persistence: false
    user_id: ''
    session_key: ''
    adopt_existing_tab: false
  cloud_provider: local
  use_gateway: false
checkpoints:
  enabled: false
  max_snapshots: 20
  max_total_size_mb: 500
  max_file_size_mb: 10
  auto_prune: true
  retention_days: 7
  min_interval_hours: 24
  delete_orphans: true
file_read_max_chars: 100000
tool_output:
  max_bytes: 50000
  max_lines: 2000
  max_line_length: 2000
tool_loop_guardrails:
  warnings_enabled: true
  hard_stop_enabled: false
  warn_after:
    exact_failure: 2
    same_tool_failure: 3
    idempotent_no_progress: 2
  hard_stop_after:
    exact_failure: 5
    same_tool_failure: 8
    idempotent_no_progress: 5
compression:
  enabled: true
  threshold: 0.5
  target_ratio: 0.2
  protect_last_n: 20
  hygiene_hard_message_limit: 400
  protect_first_n: 3
prompt_caching:
  cache_ttl: 5m
openrouter:
  response_cache: true
  response_cache_ttl: 300
  min_coding_score: 0.65
bedrock:
  region: ''
  discovery:
    enabled: true
    provider_filter: []
    refresh_interval: 3600
  guardrail:
    guardrail_identifier: ''
    guardrail_version: ''
    stream_processing_mode: async
    trace: disabled
auxiliary:
  vision:
    provider: auto
    model: ''
    timeout: 120
    download_timeout: 30
  web_extract:
    provider: auto
    model: ''
    timeout: 360
  compression:
    provider: auto
    model: ''
    timeout: 120
  skills_hub:
    provider: auto
    model: ''
    timeout: 30
  approval:
    provider: auto
    model: ''
    timeout: 30
  mcp:
    provider: auto
    model: ''
    timeout: 30
  title_generation:
    provider: auto
    model: ''
    timeout: 30
  triage_specifier:
    provider: auto
    model: ''
    timeout: 120
  curator:
    provider: auto
    model: ''
    timeout: 600
  session_search:
    api_key: ''
    base_url: ''
    extra_body: {}
    max_concurrency: 3
    model: ''
    provider: auto
    timeout: 30
display:
  compact: false
  personality: kawaii
  resume_display: full
  busy_input_mode: interrupt
  tui_auto_resume_recent: false
  bell_on_complete: false
  show_reasoning: true
  streaming: true
  timestamps: false
  final_response_markdown: strip
  persistent_output: true
  persistent_output_max_lines: 200
  inline_diffs: true
  file_mutation_verifier: true
  show_cost: false
  skin: slate
  language: en
  tui_status_indicator: kaomoji
  user_message_preview:
    first_lines: 2
    last_lines: 2
  interim_assistant_messages: true
  tool_progress_command: false
  tool_preview_length: 0
  ephemeral_system_ttl: 0
  runtime_footer:
    enabled: false
    fields:
      - model
      - context_pct
      - cwd
  copy_shortcut: auto
  pet:
    enabled: true
    slug: batmeme
    scale: 0.6
  background_process_notifications: all
  cleanup_progress: false
  tool_progress: all
dashboard:
  theme: default
  show_token_analytics: false
privacy:
  redact_pii: false
  tirith_enabled: true
  tirith_path: tirith
  tirith_timeout: 5
  tirith_fail_open: true
  website_blocklist:
    enabled: false
    domains: []
    shared_files: []
  acked_advisories: []
  allow_lazy_installs: true
cron:
  wrap_response: true
kanban:
  dispatch_in_gateway: true
  dispatch_interval_seconds: 60
  failure_limit: 2
code_execution:
  mode: project
  max_tool_calls: 50
  timeout: 300
logging:
  level: INFO
  max_size_mb: 5
  backup_count: 3
model_catalog:
  enabled: true
  url: https://hermes-agent.nousresearch.com/docs/api/model-catalog.json
  ttl_hours: 1
network:
  force_ipv4: false
streaming:
  enabled: false
sessions:
  auto_prune: false
  retention_days: 90
  vacuum_after_prune: true
  min_interval_hours: 24
onboarding:
  seen:
    busy_input_prompt: true
updates:
  pre_update_backup: false
  backup_keep: 5
lsp:
  enabled: true
  wait_mode: document
  wait_timeout: 5
  install_strategy: auto
_config_version: 33
group_sessions_per_user: true
known_plugin_toolsets:
  cli:
    - spotify
platform_toolsets:
  cli:
    - browser
    - clarify
    - code_execution
    - computer_use
    - cronjob
    - delegation
    - file
    - image_gen
    - memory
    - messaging
    - session_search
    - skills
    - terminal
    - todo
    - tts
    - vision
    - web
  discord:
    - hermes-discord
  google_chat:
    - hermes-google_chat
  homeassistant:
    - hermes-homeassistant
  qqbot:
    - hermes-qqbot
  signal:
    - hermes-signal
  slack:
    - hermes-slack
  teams:
    - hermes-teams
  telegram:
    - hermes-telegram
  whatsapp:
    - hermes-whatsapp
  yuanbao:
    - hermes-yuanbao
platforms:
  telegram:
    enabled: true
    extra:
      admin_chat_ids:
        - '${TELEGRAM_ADMIN_CHAT_IDS}'
      bot_token: '${TELEGRAM_BOT_TOKEN}'
      chat_id: '${TELEGRAM_CHAT_ID}'
      dm_policy: open
  webhook:
      enabled: true
      extra:
        host: "0.0.0.0"
        port: 8000
        routes:
          telegram:
            secret: "hermes-webhook-secret-2026-08-06"
            deliver: "telegram"
session_reset:
  at_hour: 4
  idle_minutes: 1440
  mode: both